<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="spec-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="spec-title">「在庫あり」and「特定カテゴリ」という条件を1つのSpecificationオブジェクトにまとめ、全商品から条件に合うものだけを絞り込む図(教科書的な一般像)</title>

      <rect x="10" y="10" width="540" height="360" rx="28" fill="#e8f1f4" />

      <!-- 左: 全商品 -->
      <rect x="35" y="60" width="140" height="260" rx="20" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
      <rect x="55" y="85" width="100" height="30" rx="8" fill="#2dd4bf" />
      <rect x="55" y="130" width="100" height="30" rx="8" fill="#5eead4" />
      <rect x="55" y="175" width="100" height="30" rx="8" fill="#2dd4bf" />
      <rect x="55" y="220" width="100" height="30" rx="8" fill="#5eead4" />
      <rect x="55" y="265" width="100" height="30" rx="8" fill="#2dd4bf" />
      <text x="105" y="345" text-anchor="middle" font-weight="700" font-size="13" fill="#134e4a">全商品</text>

      <!-- 条件チップ -->
      <rect x="215" y="55" width="130" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
      <text x="280" y="77" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">在庫あり</text>
      <rect x="215" y="98" width="130" height="34" rx="17" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
      <text x="280" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">特定カテゴリ</text>
      <text x="280" y="145" text-anchor="middle" font-size="12" font-weight="800" fill="#0d9488">AND / OR / NOT で合成</text>

      <!-- Specification(じょうご) -->
      <polygon points="230,165 330,165 300,230 260,230" fill="#d97706" />
      <rect x="260" y="230" width="40" height="35" fill="#d97706" />
      <text x="280" y="176" text-anchor="middle" font-weight="800" font-size="10" fill="#ffffff">Specification</text>

      <!-- 矢印: 全商品 -> じょうご -> 結果 -->
      <line x1="175" y1="190" x2="228" y2="190" stroke="#134e4a" stroke-width="4" stroke-linecap="round" />
      <polygon points="228,190 210,182 210,198" fill="#134e4a" />
      <path d="M 280 265 C 280 300, 340 300, 385 300" stroke="#134e4a" stroke-width="4" fill="none" stroke-linecap="round" />
      <polygon points="385,300 368,292 368,308" fill="#134e4a" />

      <!-- 右: 絞り込み結果 -->
      <rect x="390" y="60" width="140" height="260" rx="20" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
      <rect x="410" y="120" width="100" height="30" rx="8" fill="#2dd4bf" />
      <rect x="410" y="165" width="100" height="30" rx="8" fill="#2dd4bf" />
      <text x="460" y="345" text-anchor="middle" font-weight="700" font-size="13" fill="#134e4a">絞り込み結果</text>
    </svg>
