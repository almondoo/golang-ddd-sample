<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="agg-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="agg-title">おもちゃ箱(Order)の中身(OrderItem)を直接さわろうとすると止められ、AddItem()経由なら受け付けられることを示す図</title>

      <rect x="20" y="20" width="520" height="340" rx="28" fill="#e8f1f4" />

      <!-- おもちゃ箱(Order集約) -->
      <polygon points="180,170 215,120 345,120 380,170" fill="#d97706" opacity="0.7" />
      <rect x="180" y="170" width="200" height="140" rx="18" fill="#d97706" />

      <!-- 箱の中の3つのOrderItem -->
      <rect x="196" y="205" width="46" height="80" rx="10" fill="#0d9488" />
      <rect x="257" y="205" width="46" height="80" rx="10" fill="#2dd4bf" />
      <rect x="318" y="205" width="46" height="80" rx="10" fill="#0d9488" />

      <!-- 「Order」ネームプレート -->
      <rect x="228" y="146" width="104" height="34" rx="17" fill="#134e4a" />
      <text x="280" y="168" text-anchor="middle" fill="#f0fdfa" font-weight="800" font-size="16">Order</text>

      <!-- 左: 直接さわろうとして止められる -->
      <line x1="55" y1="240" x2="150" y2="240" stroke="#dc2626" stroke-width="7" stroke-linecap="round" />
      <polygon points="150,240 132,230 132,250" fill="#dc2626" />
      <circle cx="103" cy="240" r="36" fill="none" stroke="#dc2626" stroke-width="6" />
      <line x1="79" y1="216" x2="127" y2="264" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
      <text x="103" y="300" text-anchor="middle" fill="#134e4a" font-weight="700" font-size="14">中身を直接さわる</text>

      <!-- 右: AddItem()経由なら受け付けられる -->
      <line x1="505" y1="110" x2="400" y2="150" stroke="#0d9488" stroke-width="7" stroke-linecap="round" />
      <polygon points="400,150 413.3,134.2 420.4,152.9" fill="#0d9488" />
      <circle cx="470" cy="90" r="20" fill="#0d9488" />
      <path d="M 461 90 L 468 98 L 481 82" stroke="#f0fdfa" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="470" y="64" text-anchor="middle" font-weight="700" font-size="14" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">AddItem()</text>

      <text x="280" y="350" text-anchor="middle" font-size="14" fill="#134e4a">不変条件は、箱(集約ルート)が守る</text>
    </svg>