<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" role="img" aria-labelledby="ds-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="ds-title">ロジックの置き場所を判定するフローチャート。1つの集約で判断できれば集約のメソッドへ、同一コンテキストで複数集約をまたぐならドメインサービスへ(本リポジトリに実例なし)、コンテキストをまたぐならアプリケーションサービスへ進む</title>
      <defs>
        <marker id="ds-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#134e4a" />
        </marker>
      </defs>

      <!-- Q1: 1つの集約で判断できるか -->
      <rect x="110" y="20" width="340" height="60" rx="20" fill="#e8f1f4" stroke="#5eead4" stroke-width="2" />
      <text x="280" y="45" text-anchor="middle" font-weight="700" font-size="15" fill="#134e4a">1つの集約(ルート+子)だけで</text>
      <text x="280" y="65" text-anchor="middle" font-weight="700" font-size="15" fill="#134e4a">判断できる?</text>

      <!-- Yes -> 集約のメソッド -->
      <line x1="450" y1="50" x2="440" y2="100" stroke="#0d9488" stroke-width="4" marker-end="url(#ds-arrow)" />
      <text x="450" y="105" font-size="13" font-weight="800" fill="#0d9488">Yes</text>
      <rect x="430" y="110" width="200" height="70" rx="16" fill="#0d9488" />
      <text x="530" y="140" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">集約のメソッド</text>
      <text x="530" y="160" text-anchor="middle" font-size="9" fill="#ffffff" opacity="0.9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Customer.ChangeDefaultAddress</text>

      <!-- No -> Q2 -->
      <line x1="280" y1="80" x2="280" y2="200" stroke="#134e4a" stroke-width="4" marker-end="url(#ds-arrow)" />
      <text x="300" y="150" font-size="13" font-weight="800" fill="#134e4a">No</text>

      <!-- Q2 -->
      <rect x="100" y="210" width="360" height="60" rx="20" fill="#e8f1f4" stroke="#5eead4" stroke-width="2" />
      <text x="280" y="235" text-anchor="middle" font-weight="700" font-size="15" fill="#134e4a">同一コンテキスト内で複数集約を</text>
      <text x="280" y="255" text-anchor="middle" font-weight="700" font-size="15" fill="#134e4a">またぐ?</text>

      <!-- Yes -> ドメインサービス(不採用) -->
      <line x1="460" y1="240" x2="444" y2="300" stroke="#4b6b68" stroke-width="4" marker-end="url(#ds-arrow)" />
      <text x="465" y="290" font-size="13" font-weight="800" fill="#4b6b68">Yes</text>
      <rect x="430" y="310" width="200" height="90" rx="16" fill="#e8f1f4" stroke="#4b6b68" stroke-width="2.5" stroke-dasharray="7 6" />
      <text x="530" y="340" text-anchor="middle" font-weight="800" font-size="14" fill="#4b6b68">ドメインサービス</text>
      <text x="530" y="360" text-anchor="middle" font-size="11" fill="#4b6b68">本リポジトリに</text>
      <text x="530" y="376" text-anchor="middle" font-size="11" fill="#4b6b68">実例なし</text>
      <!-- 禁止アイコン(実例なしを示す) -->
      <circle cx="610" cy="322" r="13" fill="none" stroke="#4b6b68" stroke-width="3" />
      <line x1="601" y1="313" x2="619" y2="331" stroke="#4b6b68" stroke-width="3" stroke-linecap="round" />

      <!-- No -> アプリケーションサービス -->
      <line x1="280" y1="270" x2="280" y2="390" stroke="#d97706" stroke-width="4" marker-end="url(#ds-arrow)" />
      <text x="265" y="340" text-anchor="end" font-size="13" font-weight="800" fill="#d97706">No(コンテキストをまたぐ)</text>
      <rect x="130" y="400" width="300" height="80" rx="20" fill="#d97706" />
      <text x="280" y="435" text-anchor="middle" font-weight="800" font-size="15" fill="#ffffff">アプリケーションサービス</text>
      <text x="280" y="458" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PlaceOrderUseCase</text>
    </svg>