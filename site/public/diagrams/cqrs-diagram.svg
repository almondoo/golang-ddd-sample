<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="cqrs-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="cqrs-title">commandはUseCase→Repository→Product集約(検証)→GORM実装という経路でドメインを通り、queryはUseCase→QueryService→GORM実装(DTO直行)という経路でドメインを迂回し、両方とも同じPostgreSQLへ書き込み・問い合わせすることを示す図</title>
      <defs>
        <marker id="cqrs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#134e4a" />
        </marker>
      </defs>

      <text x="150" y="22" text-anchor="middle" font-weight="800" font-size="14" fill="#0d9488">command(書き込み)</text>
      <text x="410" y="22" text-anchor="middle" font-weight="800" font-size="14" fill="#2dd4bf">query(読み取り)</text>

      <!-- command column -->
      <rect x="60" y="35" width="180" height="50" rx="14" fill="#0d9488" />
      <text x="150" y="65" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">RegisterProductUseCase</text>
      <line x1="150" y1="85" x2="150" y2="109" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />

      <rect x="60" y="115" width="180" height="50" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
      <text x="150" y="145" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">catalog.Repository(IF)</text>
      <line x1="150" y1="165" x2="150" y2="189" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />

      <rect x="60" y="195" width="180" height="50" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
      <text x="150" y="225" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">Product集約(検証)</text>
      <line x1="150" y1="245" x2="150" y2="269" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />

      <rect x="60" y="275" width="180" height="50" rx="14" fill="#0d9488" />
      <text x="150" y="305" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff">GORM実装(INSERT/UPDATE)</text>

      <!-- query column -->
      <rect x="320" y="35" width="180" height="50" rx="14" fill="#2dd4bf" />
      <text x="410" y="65" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ListProductsUseCase</text>
      <line x1="410" y1="85" x2="410" y2="109" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />

      <rect x="320" y="115" width="180" height="50" rx="14" fill="#ffffff" stroke="#2dd4bf" stroke-width="2.5" />
      <text x="410" y="145" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ProductQueryService(IF)</text>
      <line x1="410" y1="165" x2="410" y2="269" stroke="#134e4a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#cqrs-arrow)" />
      <text x="500" y="220" text-anchor="middle" font-size="11" fill="#4b6b68">ドメインを迂回</text>

      <rect x="320" y="275" width="180" height="50" rx="14" fill="#2dd4bf" />
      <text x="410" y="298" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">GORM実装</text>
      <text x="410" y="315" text-anchor="middle" font-size="10" fill="#134e4a" opacity="0.85">(DTOに直行)</text>

      <!-- DB -->
      <line x1="150" y1="325" x2="226" y2="363" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />
      <line x1="410" y1="325" x2="334" y2="363" stroke="#134e4a" stroke-width="3" marker-end="url(#cqrs-arrow)" />
      <ellipse cx="280" cy="385" rx="110" ry="18" fill="#d97706" />
      <rect x="170" y="385" width="220" height="30" fill="#d97706" />
      <ellipse cx="280" cy="415" rx="110" ry="18" fill="#d97706" />
      <text x="280" y="404" text-anchor="middle" font-weight="800" font-size="13" fill="#ffffff">PostgreSQL(同一DB)</text>
    </svg>