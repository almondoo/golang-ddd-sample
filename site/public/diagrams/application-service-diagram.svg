<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 630" role="img" aria-labelledby="as-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="as-title">段取り係(PlaceOrderUseCase)が、1トランザクションの枠の中で6つの手順を順番に指示していく図</title>
      <defs>
        <marker id="as-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4" />
        </marker>
      </defs>

      <!-- トランザクション境界 -->
      <rect x="20" y="70" width="480" height="540" rx="28" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="10 8" />
      <rect x="150" y="40" width="220" height="40" rx="20" fill="#0d9488" />
      <text x="260" y="65" text-anchor="middle" font-weight="800" font-size="10.5" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tx.Manager.Do(1トランザクション)</text>

      <!-- 段取り係(人物) -->
      <g transform="translate(70,102)">
        <circle cx="0" cy="0" r="24" fill="#d97706" />
        <circle cx="-7" cy="-3" r="3" fill="#ffffff" />
        <circle cx="7" cy="-3" r="3" fill="#ffffff" />
        <path d="M -8 8 Q 0 15 8 8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </g>
      <text x="70" y="150" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">段取り係</text>
      <text x="70" y="165" text-anchor="middle" font-size="10" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">usecase</text>

      <g>
        <circle cx="140" cy="140" r="16" fill="#0d9488" />
        <text x="140" y="145" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">1</text>
        <rect x="170" y="110" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="136" font-weight="700" font-size="14" fill="#134e4a">顧客の実在確認</text>
        <text x="190" y="156" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">customerRepo.FindByID</text>
      </g>
      <g>
        <line x1="270" y1="170" x2="270" y2="188" stroke="#5eead4" stroke-width="3" marker-end="url(#as-arrow)" />
        <circle cx="140" cy="218" r="16" fill="#0d9488" />
        <text x="140" y="223" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">2</text>
        <rect x="170" y="188" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="214" font-weight="700" font-size="14" fill="#134e4a">カートの読み取り</text>
        <text x="190" y="234" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cartRepo.FindByCustomerID</text>
      </g>
      <g>
        <line x1="270" y1="248" x2="270" y2="266" stroke="#5eead4" stroke-width="3" marker-end="url(#as-arrow)" />
        <circle cx="140" cy="296" r="16" fill="#0d9488" />
        <text x="140" y="301" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">3</text>
        <rect x="170" y="266" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="292" font-weight="700" font-size="14" fill="#134e4a">価格取得+在庫引当</text>
        <text x="190" y="312" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">catalogRepo / inventoryRepo</text>
      </g>
      <g>
        <line x1="270" y1="326" x2="270" y2="344" stroke="#5eead4" stroke-width="3" marker-end="url(#as-arrow)" />
        <circle cx="140" cy="374" r="16" fill="#0d9488" />
        <text x="140" y="379" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">4</text>
        <rect x="170" y="344" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="370" font-weight="700" font-size="14" fill="#134e4a">Order集約の生成</text>
        <text x="190" y="390" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">domainorder.NewOrder</text>
      </g>
      <g>
        <line x1="270" y1="404" x2="270" y2="422" stroke="#5eead4" stroke-width="3" marker-end="url(#as-arrow)" />
        <circle cx="140" cy="452" r="16" fill="#0d9488" />
        <text x="140" y="457" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">5</text>
        <rect x="170" y="422" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="448" font-weight="700" font-size="14" fill="#134e4a">クーポン適用(あれば)</text>
        <text x="190" y="468" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">couponRepo → o.ApplyDiscount</text>
      </g>
      <g>
        <line x1="270" y1="482" x2="270" y2="500" stroke="#5eead4" stroke-width="3" marker-end="url(#as-arrow)" />
        <circle cx="140" cy="530" r="16" fill="#0d9488" />
        <text x="140" y="535" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff">6</text>
        <rect x="170" y="500" width="300" height="60" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
        <text x="190" y="526" font-weight="700" font-size="14" fill="#134e4a">保存してカートを空に</text>
        <text x="190" y="546" font-size="11" fill="#4b6b68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">orderRepo.Save / cart.Clear</text>
      </g>
    </svg>
