<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="factory-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="factory-title">新規生成はNewProductが検証してから*Productを作り、再構築はReconstructProductがDBの検証済みデータをそのまま復元する、2つの経路を示す図</title>
      <defs>
        <marker id="factory-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#134e4a" />
        </marker>
      </defs>

      <rect x="10" y="10" width="580" height="380" rx="28" fill="#e8f1f4" />

      <!-- 新規生成レーン -->
      <text x="35" y="45" font-weight="800" font-size="15" fill="#134e4a">新規生成</text>
      <rect x="30" y="60" width="150" height="50" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
      <text x="105" y="90" text-anchor="middle" font-size="12" fill="#134e4a">name / desc / price</text>
      <line x1="180" y1="85" x2="205" y2="85" stroke="#134e4a" stroke-width="4" marker-end="url(#factory-arrow)" />

      <rect x="210" y="60" width="230" height="70" rx="18" fill="#0d9488" />
      <text x="325" y="90" text-anchor="middle" font-weight="800" font-size="15" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">NewProduct</text>
      <text x="325" y="110" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">(検証あり)</text>

      <line x1="440" y1="80" x2="462" y2="65" stroke="#0d9488" stroke-width="4" marker-end="url(#factory-arrow)" />
      <rect x="470" y="30" width="110" height="50" rx="14" fill="#2dd4bf" />
      <text x="525" y="51" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">*Product</text>
      <text x="525" y="67" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">(新規)</text>

      <line x1="440" y1="110" x2="470" y2="150" stroke="#dc2626" stroke-width="4" marker-end="url(#factory-arrow)" />
      <circle cx="505" cy="165" r="16" fill="none" stroke="#dc2626" stroke-width="4" />
      <line x1="494" y1="154" x2="516" y2="176" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
      <text x="505" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">検証NG→エラー</text>

      <!-- 区切り線 -->
      <line x1="30" y1="225" x2="570" y2="225" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 6" />

      <!-- 再構築レーン -->
      <text x="35" y="255" font-weight="800" font-size="15" fill="#134e4a">再構築(リポジトリ専用)</text>
      <rect x="30" y="270" width="150" height="50" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2" />
      <text x="105" y="300" text-anchor="middle" font-size="12" fill="#134e4a">DB行(検証済み)</text>
      <line x1="180" y1="295" x2="205" y2="295" stroke="#134e4a" stroke-width="4" marker-end="url(#factory-arrow)" />

      <rect x="210" y="270" width="260" height="70" rx="18" fill="#d97706" />
      <text x="340" y="300" text-anchor="middle" font-weight="800" font-size="14" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ReconstructProduct</text>
      <text x="340" y="320" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">(検証なし)</text>

      <line x1="470" y1="305" x2="485" y2="305" stroke="#d97706" stroke-width="4" marker-end="url(#factory-arrow)" />
      <rect x="495" y="280" width="90" height="50" rx="14" fill="#2dd4bf" />
      <text x="540" y="301" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">*Product</text>
      <text x="540" y="317" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">(復元)</text>

      <text x="340" y="375" text-anchor="middle" font-size="13" fill="#134e4a">Reconstruct*はRepositoryのFindByID内でのみ呼ばれる</text>
    </svg>