<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="repo-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="repo-title">呼び出し側が倉庫係に「保存して」「持ってきて」とだけ話し、SQLはカーテンの向こうに隠れている図</title>

      <rect x="20" y="20" width="520" height="340" rx="28" fill="#e8f1f4" />

      <!-- 左: 呼び出し側(UseCase) -->
      <g transform="translate(130,235)">
        <rect x="-30" y="-10" width="60" height="70" rx="22" fill="#0d9488" />
        <circle cx="0" cy="-38" r="26" fill="#f0fdfa" />
        <circle cx="-8" cy="-40" r="3" fill="#134e4a" />
        <circle cx="8" cy="-40" r="3" fill="#134e4a" />
        <path d="M -9 -28 Q 0 -21 9 -28" stroke="#134e4a" stroke-width="2.6" fill="none" stroke-linecap="round" />
      </g>
      <text x="130" y="330" text-anchor="middle" font-weight="700" font-size="14" fill="#134e4a">呼び出す側(UseCase)</text>

      <!-- 吹き出し -->
      <rect x="185" y="130" width="150" height="40" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
      <text x="260" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">保存して</text>
      <rect x="175" y="185" width="200" height="40" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
      <text x="275" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">ID: P-001を持ってきて</text>

      <!-- 右: 倉庫係(Repository実装) -->
      <g transform="translate(420,235)">
        <rect x="-30" y="-10" width="60" height="70" rx="22" fill="#d97706" />
        <circle cx="0" cy="-38" r="26" fill="#f0fdfa" />
        <circle cx="-8" cy="-40" r="3" fill="#134e4a" />
        <circle cx="8" cy="-40" r="3" fill="#134e4a" />
        <path d="M -9 -28 Q 0 -21 9 -28" stroke="#134e4a" stroke-width="2.6" fill="none" stroke-linecap="round" />
      </g>
      <text x="420" y="330" text-anchor="middle" font-weight="700" font-size="14" fill="#134e4a">倉庫係(Repository)</text>

      <!-- 倉庫係の裏に隠れたSQL(カーテンの向こう) -->
      <rect x="470" y="90" width="70" height="130" rx="14" fill="#134e4a" />
      <!-- 南京錠アイコン(絵文字ではなく図形で描く) -->
      <path
        d="M 495 140 a 10 10 0 0 1 20 0 v 8 h -20 z"
        fill="none"
        stroke="#f0fdfa"
        stroke-width="3.5"
        opacity="0.9"
      />
      <rect x="490" y="148" width="30" height="24" rx="5" fill="#f0fdfa" opacity="0.9" />
      <text x="505" y="195" text-anchor="middle" font-weight="800" font-size="15" fill="#f0fdfa" opacity="0.9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SQL</text>
    </svg>