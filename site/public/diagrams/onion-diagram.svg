<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="onion-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="onion-title">中心のdomainを、application・infrastructure/presentationの同心円が取り囲み、依存の矢印はすべて内向きであることを示す図</title>

      <!-- 外側の輪: presentation / infrastructure -->
      <circle cx="260" cy="260" r="230" fill="#2dd4bf" />
      <!-- 中間の輪: application -->
      <circle cx="260" cy="260" r="152" fill="#0d9488" />
      <!-- 中心: domain -->
      <circle cx="260" cy="260" r="76" fill="#d97706" />

      <!-- 内向きの依存矢印(3方向)。1本目は「アプリケーション」ラベルとの重なりを避けるため35度回転させて配置している -->
      <g transform="rotate(35 260 260)">
        <line x1="260" y1="55" x2="260" y2="165" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
        <polygon points="260,180 250,158 270,158" fill="#ffffff" stroke="#134e4a" stroke-width="1.5" />
      </g>
      <g transform="rotate(120 260 260)">
        <line x1="260" y1="55" x2="260" y2="165" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
        <polygon points="260,180 250,158 270,158" fill="#ffffff" stroke="#134e4a" stroke-width="1.5" />
      </g>
      <g transform="rotate(240 260 260)">
        <line x1="260" y1="55" x2="260" y2="165" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
        <polygon points="260,180 250,158 270,158" fill="#ffffff" stroke="#134e4a" stroke-width="1.5" />
      </g>

      <!-- 中心: domain ラベル -->
      <text x="260" y="252" text-anchor="middle" font-weight="800" font-size="19" fill="#f0fdfa">ドメイン</text>
      <text x="260" y="274" text-anchor="middle" font-size="12" fill="#f0fdfa" opacity="0.9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">internal/domain</text>

      <!-- 中間の輪: application ラベル -->
      <text x="260" y="122" text-anchor="middle" font-weight="800" font-size="16" fill="#f0fdfa">アプリケーション</text>
      <text x="260" y="140" text-anchor="middle" font-size="11" fill="#f0fdfa" opacity="0.9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">internal/application</text>

      <!-- 外側の輪ラベル: presentation(上)・infrastructure(下) -->
      <text x="260" y="45" text-anchor="middle" font-weight="800" font-size="15" fill="#134e4a">プレゼンテーション</text>
      <text x="260" y="62" text-anchor="middle" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">internal/presentation</text>
      <text x="260" y="462" text-anchor="middle" font-weight="800" font-size="15" fill="#134e4a">インフラストラクチャ</text>
      <text x="260" y="479" text-anchor="middle" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">internal/infrastructure</text>
    </svg>