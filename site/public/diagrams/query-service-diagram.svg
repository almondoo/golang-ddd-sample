<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="qs-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
      <title id="qs-title">書く窓口はUseCaseから集約(ドメイン)を経てRepositoryへ進みDBに書き込むのに対し、見る窓口はUseCaseからQueryServiceへ進みドメイン箱を素通りしてDTOを直接DBから組み立てることを示す図</title>
      <defs>
        <marker id="qs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#134e4a" />
        </marker>
      </defs>

      <text x="150" y="26" text-anchor="middle" font-weight="800" font-size="15" fill="#0d9488">書く窓口</text>
      <text x="450" y="26" text-anchor="middle" font-weight="800" font-size="15" fill="#2dd4bf">見る窓口</text>

      <!-- 書く窓口カウンター -->
      <rect x="50" y="40" width="200" height="52" rx="14" fill="#0d9488" />
      <text x="150" y="71" text-anchor="middle" font-weight="700" font-size="11" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ChangePriceUseCase</text>
      <line x1="150" y1="92" x2="150" y2="116" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />

      <rect x="50" y="122" width="200" height="52" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
      <text x="150" y="153" text-anchor="middle" font-weight="700" font-size="13" fill="#134e4a">集約(ドメイン)</text>
      <text x="150" y="168" text-anchor="middle" font-size="10" fill="#134e4a" opacity="0.85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Product / Cart</text>
      <line x1="150" y1="174" x2="150" y2="198" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />

      <rect x="50" y="204" width="200" height="52" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
      <text x="150" y="235" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">catalog.Repository(IF)</text>
      <line x1="150" y1="256" x2="150" y2="280" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />

      <rect x="50" y="286" width="200" height="52" rx="14" fill="#0d9488" />
      <text x="150" y="317" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">正式ルートを通って保存</text>

      <!-- 見る窓口カウンター -->
      <rect x="350" y="40" width="200" height="52" rx="14" fill="#2dd4bf" />
      <text x="450" y="71" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ListProductsUseCase</text>
      <line x1="450" y1="92" x2="450" y2="116" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />

      <rect x="350" y="122" width="200" height="52" rx="14" fill="#ffffff" stroke="#2dd4bf" stroke-width="2.5" />
      <text x="450" y="148" text-anchor="middle" font-weight="700" font-size="10.5" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ProductQueryService(IF)</text>
      <text x="450" y="163" text-anchor="middle" font-size="10" fill="#134e4a" opacity="0.8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">CartQueryService(IF)</text>

      <!-- 素通りされるドメイン箱(薄く・バツ印) -->
      <g opacity="0.5">
        <rect x="245" y="128" width="90" height="40" rx="10" fill="none" stroke="#4b6b68" stroke-width="2.5" stroke-dasharray="6 5" />
        <text x="290" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#4b6b68">ドメイン</text>
        <line x1="252" y1="135" x2="328" y2="161" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
        <line x1="328" y1="135" x2="252" y2="161" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="290" y="115" text-anchor="middle" font-size="11" fill="#4b6b68">素通り</text>

      <line x1="450" y1="174" x2="450" y2="198" stroke="#134e4a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#qs-arrow)" />

      <rect x="350" y="204" width="200" height="52" rx="14" fill="#ffffff" stroke="#2dd4bf" stroke-width="2.5" />
      <text x="450" y="227" text-anchor="middle" font-weight="700" font-size="11" fill="#134e4a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">persistence.*Query</text>
      <text x="450" y="243" text-anchor="middle" font-size="10" fill="#134e4a" opacity="0.85">DTOに直行</text>
      <line x1="450" y1="256" x2="450" y2="280" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />

      <rect x="350" y="286" width="200" height="52" rx="14" fill="#2dd4bf" />
      <text x="450" y="317" text-anchor="middle" font-weight="700" font-size="12" fill="#134e4a">DTOを直接返す</text>

      <!-- DB -->
      <line x1="150" y1="338" x2="240" y2="376" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />
      <line x1="450" y1="338" x2="360" y2="376" stroke="#134e4a" stroke-width="3" marker-end="url(#qs-arrow)" />
      <ellipse cx="300" cy="398" rx="120" ry="18" fill="#d97706" />
      <rect x="180" y="398" width="240" height="30" fill="#d97706" />
      <ellipse cx="300" cy="428" rx="120" ry="18" fill="#d97706" />
      <text x="300" y="417" text-anchor="middle" font-weight="800" font-size="13" fill="#ffffff">PostgreSQL(同一DB)</text>
    </svg>